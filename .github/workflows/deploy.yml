name: Deploy via Tailscale SSH

on:
  push:
    branches:
      - main

jobs:
  deploy-homelab:
    name: Deploy via SSH to Homelab
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Tailscale on Homelab
        env:
          API_KEY: ${{ secrets.ALERT_API_KEY }} 
          TSL_API_URL: ${{ secrets.TSL_API_URL }}
        run: |
          curl -s -H "x-api-key: $API_KEY" "$TSL_API_URL"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.66.0

      - name: Setup SSH Key and Known Hosts
        run: |
          mkdir -p ~/.ssh
          
          # Hapus karakter \r (Windows CRLF) agar OpenSSH tidak error
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          echo "Memastikan koneksi Tailscale..."
          while true; do
            tailscale_status="$(tailscale status | grep 'linux' | grep 'homelab')"
            if [ "${tailscale_status}" ]; then break; fi
          done
          
          ssh-keyscan -T 10 -H ${{ secrets.HOST_1_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -T 10 -H ${{ secrets.HOST_2_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute Pull on Homelab-1
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.HOST_1_IP }} << EOF
            cd /root/homelab-infrastructure
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            
            # Mengaktifkan file crontab-root.txt menjadi crontab sistem
            crontab scripts/homelab-1/crontab-list.txt

            # Gunakan substitusi langsung GitHub Secrets agar tidak lolos saat HereDoc (EOF)
            curl -s -X POST http://localhost:3001/api/alert \
              -H "x-api-key: ${{ secrets.ALERT_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"text": "✅ Sinkronisasi CI/CD Github ke Homelab-1 Berhasil!", "type": "INFO"}' || true
          EOF
      
      - name: Execute Pull on Homelab-2
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.HOST_2_IP }} << EOF
            cd /root/homelab-infrastructure
            git fetch --all
            git reset --hard origin/main
            git pull origin main

            # Mengaktifkan file crontab-root.txt menjadi crontab sistem
            crontab scripts/homelab-2/crontab-list.txt
            
            # Gunakan substitusi langsung GitHub Secrets agar tidak lolos saat HereDoc (EOF)
            curl -s -X POST http://localhost:3001/api/alert \
              -H "x-api-key: ${{ secrets.ALERT_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"text": "✅ Sinkronisasi CI/CD Github ke Homelab-2 Berhasil!", "type": "INFO"}' || true
          EOF