version: "3.10"

services:
  influxdb:
    # image: influxdb:1.8
    image: registry.localhostaddr.biz.id/influxdb:1.8
    ports:
      - target: 8086
        published: 8086
        protocol: tcp
        mode: host
    volumes:
      # Pastikan path ini sudah ada beserta datanya di homelab-2
      - /mnt/disk1/influxdb:/var/lib/influxdb
    networks:
      - net
    deploy:
      placement:
        constraints:
          - node.hostname == homelab-2

networks:
  net:
    # Mutlak diperlukan agar Node 1 dan Node 2 bisa saling ping antara grafana dengan influxdb
    external: true
