version: '3.8'

services:
  openfortivpn:
    image: registry.localhostaddr.biz.id/openfortivpn:latest
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/ppp:/dev/ppp"
    volumes:
      - /root/homelab-infrastructure/docker/forticlient/configs/config:/etc/openfortivpn/config:ro
    env_file:
      - .env
    network_mode: "host"
